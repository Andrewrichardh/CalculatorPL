  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

70b4d21-206b-4645-84a5-17ac3c2dae91\" alt=\"GIFS\" style=\"height:24px;width:auto;display:block\">\n      <img src=\"31f6f07c-6a6a-4dbf-85a6-427213f3f375\" alt=\"Global Goals 2030\" style=\"height:30px;width:auto;display:block\">\n      <span style=\"width:1px;height:20px;background:rgba(255,255,255,.28);display:block\"><\u002Fspan>\n      <span style=\"display:inline-flex;background:#fff;padding:5px 10px\"><img src=\"e6c6577a-795a-4342-b18b-8a4149c7ad84\" alt=\"Pepkor Lifestyle\" style=\"height:20px;width:auto;display:block\"><\u002Fspan>\n      <span style=\"margin-left:auto;font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;color:#9FB6B4\">COHORT 3 RATES<\u002Fspan>\n    <\u002Fheader>\n\n    <div style=\"margin-top:clamp(24px,3vw,36px)\">\n      <h1 style=\"margin:0;font:800 clamp(28px,4vw,44px)/1.05 'Montserrat',sans-serif;letter-spacing:-.035em;color:#fff\">Scholarship calculator<\u002Fh1>\n      <p style=\"margin:12px 0 0;max-width:56ch;font-size:15.5px;line-height:1.6;color:#B4CAC8\">Add as many qualifications as you need. The scholarship discount applies the moment you add a line.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:26px;border:1px solid rgba(255,255,255,.18)\">\n      <div class=\"no-print\" style=\"padding:20px clamp(16px,2.4vw,26px);display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;border-bottom:1px solid rgba(255,255,255,.16)\">\n        <label style=\"flex:3 1 260px;min-width:0\">\n          <span style=\"display:block;font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#B4CAC8;margin-bottom:10px\">QUALIFICATION<\u002Fspan>\n          <sc-raw-select value=\"{{ pick }}\" sc-camel-on-change=\"{{ onPick }}\" style=\"width:100%;background:#0B2E33;border:1px solid rgba(255,255,255,.26);padding:12px 10px;font:600 15px/1.2 'Montserrat',sans-serif;color:#fff;outline:none\">\n            <sc-for list=\"{{ options }}\" as=\"o\" hint-placeholder-count=\"8\">\n              <option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-select>\n        <\u002Flabel>\n        <label style=\"flex:0 0 110px\">\n          <span style=\"display:block;font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#B4CAC8;margin-bottom:10px\">LEARNERS<\u002Fspan>\n          <input type=\"number\" min=\"1\" step=\"1\" value=\"{{ qty }}\" sc-camel-on-change=\"{{ onQty }}\" style=\"width:100%;background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.26);padding:0 0 10px;font:700 22px/1 'IBM Plex Mono',monospace;color:#fff;outline:none\">\n        <\u002Flabel>\n        <button type=\"button\" sc-camel-on-click=\"{{ onAdd }}\" style=\"flex:0 0 auto;padding:14px 22px;border:0;background:#A4CE39;color:#092A2E;font:700 11.5px/1 'Montserrat',sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer\">Add<\u002Fbutton>\n\n        <sc-if value=\"{{ pickHasVariants }}\" hint-placeholder-val=\"{{ false }}\">\n          <label style=\"flex:1 1 100%\">\n            <span style=\"display:block;font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#B4CAC8;margin:6px 0 10px\">{{ variantTitle }}<\u002Fspan>\n            <sc-raw-select value=\"{{ variantValue }}\" sc-camel-on-change=\"{{ onVariant }}\" style=\"width:100%;background:#0B2E33;border:1px solid rgba(255,255,255,.26);padding:12px 10px;font:600 14px/1.2 'Montserrat',sans-serif;color:#fff;outline:none\">\n              <sc-for list=\"{{ variantOptions }}\" as=\"v\" hint-placeholder-count=\"4\">\n                <option value=\"{{ v.value }}\">{{ v.label }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Flabel>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ pickIsCustom }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"flex:1 1 100%;display:flex;flex-wrap:wrap;gap:14px;padding-top:6px\">\n            <label style=\"flex:2 1 200px;min-width:0;font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#B4CAC8\">NAME\n              <input value=\"{{ customLabel }}\" sc-camel-on-change=\"{{ onCustomLabel }}\" placeholder=\"Qualification we must source\" style=\"display:block;width:100%;margin-top:8px;background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.26);padding:5px 0;font:700 14px/1.2 'Montserrat',sans-serif;color:#fff;outline:none\">\n            <\u002Flabel>\n            <label style=\"flex:1 1 130px;font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#B4CAC8\">TOTAL VALUE (R)\n              <input type=\"number\" min=\"0\" step=\"1000\" value=\"{{ customTotal }}\" sc-camel-on-change=\"{{ onCustomTotal }}\" style=\"display:block;width:100%;margin-top:8px;background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.26);padding:5px 0;font:600 15px/1.2 'IBM Plex Mono',monospace;color:#fff;outline:none\">\n            <\u002Flabel>\n            <label style=\"flex:1 1 130px;font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#B4CAC8\">YOU PAY (R)\n              <input type=\"number\" min=\"0\" step=\"1000\" value=\"{{ customClient }}\" sc-camel-on-change=\"{{ onCustomClient }}\" style=\"display:block;width:100%;margin-top:8px;background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.26);padding:5px 0;font:600 15px/1.2 'IBM Plex Mono',monospace;color:#64C3DD;outline:none\">\n            <\u002Flabel>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px clamp(16px,2.4vw,26px);background:#0B2E33;border-bottom:1px solid rgba(255,255,255,.14)\">\n        <span style=\"flex:1 1 200px;font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#9FB6B4\">QUALIFICATION<\u002Fspan>\n        <span style=\"width:70px;text-align:center;font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#9FB6B4\">QTY<\u002Fspan>\n        <span style=\"width:104px;text-align:right;font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#9FB6B4\">VALUE<\u002Fspan>\n        <span style=\"width:104px;text-align:right;font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#A4CE39\">DISCOUNT<\u002Fspan>\n        <span style=\"width:110px;text-align:right;font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#64C3DD\">YOU PAY<\u002Fspan>\n        <span class=\"no-print\" style=\"width:22px\"><\u002Fspan>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ isEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"padding:26px clamp(16px,2.4vw,26px);font-size:14px;line-height:1.5;color:#9FB6B4\">Nothing added yet — choose a qualification above and press Add.<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-for list=\"{{ rows }}\" as=\"row\" hint-placeholder-count=\"0\">\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:14px clamp(16px,2.4vw,26px);border-bottom:1px solid rgba(255,255,255,.1)\">\n          <div style=\"flex:1 1 200px;min-width:0\">\n            <div style=\"font:700 14.5px/1.3 'Montserrat',sans-serif;color:#fff\">{{ row.label }}<\u002Fdiv>\n            <div style=\"margin-top:4px;font:500 11px/1.3 'IBM Plex Mono',monospace;color:#9FB6B4\">{{ row.detail }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:70px;display:flex;align-items:center;justify-content:center;gap:6px\">\n            <button type=\"button\" sc-camel-on-click=\"{{ row.dec }}\" class=\"no-print\" style=\"width:22px;height:22px;border:0;background:rgba(255,255,255,.1);color:#fff;font:600 13px/1 sans-serif;cursor:pointer\">−<\u002Fbutton>\n            <span style=\"min-width:22px;text-align:center;font:700 15px/1 'IBM Plex Mono',monospace;color:#fff\">{{ row.qty }}<\u002Fspan>\n            <button type=\"button\" sc-camel-on-click=\"{{ row.inc }}\" class=\"no-print\" style=\"width:22px;height:22px;border:0;background:#A4CE39;color:#092A2E;font:600 13px/1 sans-serif;cursor:pointer\">+<\u002Fbutton>\n          <\u002Fdiv>\n          <span style=\"width:104px;text-align:right;font:600 13px/1 'IBM Plex Mono',monospace;color:#fff\">{{ row.valueFmt }}<\u002Fspan>\n          <span style=\"width:104px;text-align:right;font:600 13px/1 'IBM Plex Mono',monospace;color:#A4CE39\">−{{ row.discountFmt }}<\u002Fspan>\n          <span style=\"width:110px;text-align:right;font:700 14px/1 'IBM Plex Mono',monospace;color:#64C3DD\">{{ row.clientFmt }}<\u002Fspan>\n          <button type=\"button\" sc-camel-on-click=\"{{ row.remove }}\" class=\"no-print\" style=\"width:22px;background:none;border:0;color:#9FB6B4;font:600 13px/1 'IBM Plex Mono',monospace;cursor:pointer\">✕<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:1px;background:rgba(255,255,255,.14);border-top:1px solid rgba(255,255,255,.16)\">\n        <div style=\"background:#0B2E33;padding:20px clamp(16px,2.4vw,24px)\">\n          <div style=\"font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#B4CAC8\">LEARNERS<\u002Fdiv>\n          <div style=\"margin-top:12px;font:700 clamp(20px,2.4vw,28px)/1 'Montserrat',sans-serif;color:#fff\">{{ learners }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#0B2E33;padding:20px clamp(16px,2.4vw,24px)\">\n          <div style=\"font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#B4CAC8\">TOTAL VALUE<\u002Fdiv>\n          <div style=\"margin-top:12px;font:600 clamp(18px,2.2vw,26px)/1 'IBM Plex Mono',monospace;color:#fff\">{{ totalFmt }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#0B2E33;padding:20px clamp(16px,2.4vw,24px)\">\n          <div style=\"font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#A4CE39\">SCHOLARSHIP DISCOUNT<\u002Fdiv>\n          <div style=\"margin-top:12px;font:600 clamp(18px,2.2vw,26px)/1 'IBM Plex Mono',monospace;color:#A4CE39\">−{{ discountFmt }}<\u002Fdiv>\n          <div style=\"margin-top:8px;font:600 12px/1 'IBM Plex Mono',monospace;color:#A4CE39\">{{ discountPct }} off<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#0B2E33;box-shadow:inset 0 0 0 1px #64C3DD;padding:20px clamp(16px,2.4vw,24px)\">\n          <div style=\"font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#64C3DD\">PEPKOR LIFESTYLE PAYS<\u002Fdiv>\n          <div style=\"margin-top:12px;font:800 clamp(20px,2.6vw,30px)/1 'Montserrat',sans-serif;letter-spacing:-.02em;color:#64C3DD\">{{ clientFmt }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;gap:24px;margin-top:24px\">\n      <div style=\"flex:1 1 280px\">\n        <div style=\"font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#B4CAC8\">YOUR SKILLS BUDGET (R)<\u002Fdiv>\n        <input type=\"number\" min=\"0\" step=\"100000\" value=\"{{ budget }}\" sc-camel-on-change=\"{{ onBudget }}\" style=\"width:100%;margin-top:10px;background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.3);padding:0 0 8px;font:600 22px/1 'IBM Plex Mono',monospace;color:#fff;outline:none\">\n        <div style=\"margin-top:12px;height:8px;background:rgba(255,255,255,.12)\">\n          <div style=\"height:100%;background:{{ budgetColor }};width:{{ budgetBar }};transition:width .25s ease\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:10px;font:600 12px/1.4 'IBM Plex Mono',monospace;color:{{ budgetColor }}\">{{ budgetNote }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"no-print\" style=\"flex:1 1 280px;display:flex;flex-wrap:wrap;gap:12px\">\n        <button type=\"button\" sc-camel-on-click=\"{{ onPrint }}\" style=\"padding:14px 20px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;font:700 11.5px/1 'Montserrat',sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer\">Print / save PDF<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ onClear }}\" style=\"padding:14px 14px;border:0;background:none;color:#9FB6B4;font:700 11.5px/1 'Montserrat',sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer\">Clear<\u002Fbutton>\n        <a href=\"https://globalgoals-2030.com/\" target=\"_blank\" rel=\"noopener\" style=\"padding:14px 20px;background:#A4CE39;color:#092A2E;font:700 11.5px/1 'Montserrat',sans-serif;letter-spacing:.1em;text-transform:uppercase\">Request a proposal<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:26px;padding-top:18px;border-top:1px solid rgba(255,255,255,.16);font-size:12.5px;line-height:1.6;color:#9FB6B4\">Cohort 3 rates. All amounts exclusive of VAT. International pricing subject to prevailing exchange rates. Costings confirmed on quotation. Global Goals 2030 · Africa Scholarship, aligned to UN SDG 4.<\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nclass Component extends DCLogic {\n  state = {\n    pick: '', variant: '', qty: 1, rows: [], nextId: 1,\n    custom: { label: '', total: 50000, client: 25000 },\n    budget: 9000000\n  };\n\n  catalogue() {\n    const L = (key, label, total, client, dur, variants) => ({ key, label, total, client, dur, variants });\n    const FIELDS = ['Business & Finance', 'Management', 'Banking', 'Finance', 'Insurance & Risk', 'Financial Planning', 'Computer Sciences', 'Cybersecurity'];\n    return [\n      L('FETC_GM', 'FETC: Generic Management (learnership)', 30000, 13000, 'NQF 4 · 12 mo · local',\n        { title: 'CONTEXTUALISE FOR', options: ['Sales / Retail', 'Retail Operations', 'Credit & Value-Added Services', 'Contact Centre & Collections', 'Store & Area Management'] }),\n      L('FETC_STI', 'FETC: Short Term Insurance', 30000, 13000, 'NQF 4 · 12 mo · local'),\n      L('FETC_LTI', 'FETC: Long Term Insurance', 30000, 13000, 'NQF 4 · 12 mo · local'),\n      L('FETC_WM', 'FETC: Wealth Management', 30000, 13000, 'NQF 4 · 12 mo · local'),\n      L('QCTO', 'Occupational Certificate (QCTO)', 35000, 16000, 'NQF 4–6 · 12–36 mo · local',\n        { title: 'CHOOSE THE OCCUPATION', options: ['Insurance Claims Administrator', 'Long Term Insurance Advisor', 'Office Supervisor', 'Office Administrator', 'Management Assistant', 'Contact Centre Manager', 'Project Management', 'Organisational Risk Manager', 'Health Care Benefits Advisor', 'Employee & Pension Benefits Advisor'] }),\n      L('LOCAL_BCOM', 'Bachelors: Business Marketing', 70000, 16000, 'NQF 7 · 36 mo · local'),\n      L('HC', 'Higher Certificate', 50000, 16000, '18 mo · international',\n        { title: 'CHOOSE THE FIELD', options: ['Customer Service', 'Contact Centre Operations', 'Leadership', 'Broker Development', 'Project Management', 'Financial Services', ...FIELDS] }),\n      L('ADVCERT', 'Advanced Certificate', 50000, 20000, '30 mo · international', { title: 'CHOOSE THE FIELD', options: FIELDS }),\n      L('DIP', 'Diploma', 50000, 30000, '42 mo · international', { title: 'CHOOSE THE FIELD', options: ['Insurance', 'Financial Regulated Planning', ...FIELDS] }),\n      L('AML', 'Global Certificate in Anti Money Laundering', 50000, 16000, '3 mo · FIBA/FIU'),\n      L('CII_AWARD', 'CII Award — General Insurance / Customer Service', 50000, 15000, '2 mo · CII UK'),\n      L('CII_CERT', 'CII Certificate in Insurance & Financial Services', 50000, 25000, '4 mo · CII UK'),\n      L('CII_LP', 'CII Certificate in Financial Services (LP1–LP3)', 50000, 25000, '6 mo · CII UK'),\n      L('CII_INS', 'CII Certificate in Insurance', 50000, 40000, '6 mo · CII UK'),\n      L('CII_PARA', 'CII Certificate in Paraplanning', 50000, 35000, '12 mo · CII UK'),\n      L('CII_DIP', 'CII Diploma in Insurance', 50000, 45000, '24 mo · CII UK'),\n      L('CII_FRP', 'CII Diploma in Financial Regulated Planning', 50000, 45000, '24 mo · CII UK'),\n      L('BSC', 'BSc', 680000, 210000, '42 mo · R60,000 per year',\n        { title: 'CHOOSE THE DEGREE', options: ['Business with Finance', 'Computer Science', 'Cybersecurity'] }),\n      L('PGDIP', 'Postgraduate Diploma', 680000, 65000, '12 mo · R65,000 per year',\n        { title: 'CHOOSE THE FIELD', options: ['Business Administration', 'Organisational Risk Management', 'Governance', 'Financial Planning'] }),\n      L('MBA', 'MBA', 1350000, 99000, '18 mo · R66,000 per year',\n        { title: 'CHOOSE THE CONCENTRATION', options: ['General Management', 'Finance', 'Marketing & Sales', 'Strategy & Leadership', 'Digital & Innovation'] }),\n      L('DBA', 'Doctor of Business Administration', 1800000, 240000, '36 mo · R80,000 per year',\n        { title: 'CHOOSE THE SPECIALISATION', options: ['General Management', 'Finance & Investment', 'Strategic Leadership', 'Marketing & Innovation'] })\n    ];\n  }\n\n  add() {\n    const pick = this.state.pick;\n    if (!pick) return;\n    const qty = Math.max(1, Number(this.state.qty) || 1);\n    const id = this.state.nextId;\n    if (pick === '__custom') {\n      const c = this.state.custom;\n      this.setState(s => ({\n        rows: [...s.rows, { id, label: c.label || 'Custom qualification', detail: 'Sourced for you', total: Number(c.total) || 0, client: Number(c.client) || 0, qty }],\n        nextId: id + 1\n      }));\n      return;\n    }\n    const item = this.catalogue().find(i => i.key === pick);\n    if (!item) return;\n    const variant = item.variants ? (this.state.variant || item.variants.options[0]) : null;\n    const label = variant ? `${item.label} — ${variant}` : item.label;\n    this.setState(s => {\n      const existing = s.rows.find(r => r.label === label);\n      if (existing) return { rows: s.rows.map(r => r === existing ? { ...r, qty: r.qty + qty } : r) };\n      return { rows: [...s.rows, { id, label, detail: item.dur, total: item.total, client: item.client, qty }], nextId: id + 1 };\n    });\n  }\n\n  bump(id, delta) {\n    this.setState(s => ({ rows: s.rows.map(r => r.id === id ? { ...r, qty: Math.max(0, r.qty + delta) } : r).filter(r => r.qty > 0) }));\n  }\n\n  renderVals() {\n    const money = v => 'R' + Math.round(Number(v) || 0).toLocaleString('en-US');\n    const rows = this.state.rows.map(r => ({\n      label: r.label, detail: r.detail, qty: r.qty,\n      valueFmt: money(r.qty * r.total),\n      discountFmt: money(r.qty * Math.max(0, r.total - r.client)),\n      clientFmt: money(r.qty * r.client),\n      inc: () => this.bump(r.id, 1),\n      dec: () => this.bump(r.id, -1),\n      remove: () => this.bump(r.id, -r.qty)\n    }));\n    const total = this.state.rows.reduce((a, r) => a + r.qty * r.total, 0);\n    const client = this.state.rows.reduce((a, r) => a + r.qty * r.client, 0);\n    const discount = Math.max(0, total - client);\n    const learners = this.state.rows.reduce((a, r) => a + r.qty, 0);\n    const picked = this.catalogue().find(i => i.key === this.state.pick);\n    const budget = Number(this.state.budget) || 0;\n    const budgetPct = budget > 0 ? (client / budget * 100) : 0;\n    const over = budget > 0 && client > budget;\n\n    return {\n      rows, isEmpty: rows.length === 0, learners,\n      pick: this.state.pick,\n      pickIsCustom: this.state.pick === '__custom',\n      onPick: e => this.setState({ pick: e.target.value, variant: '' }),\n      pickHasVariants: !!picked?.variants,\n      variantTitle: picked?.variants ? picked.variants.title : '',\n      variantValue: this.state.variant || (picked?.variants ? picked.variants.options[0] : ''),\n      variantOptions: picked?.variants ? picked.variants.options.map(o => ({ value: o, label: o })) : [],\n      onVariant: e => this.setState({ variant: e.target.value }),\n      options: [\n        { value: '', label: '— Select a qualification —' },\n        ...this.catalogue().map(i => ({ value: i.key, label: `${i.label} · ${money(i.total)}` })),\n        { value: '__custom', label: 'Custom — not listed, we source it' }\n      ],\n      qty: this.state.qty,\n      onQty: e => this.setState({ qty: Math.max(1, Number(e.target.value) || 1) }),\n      onAdd: () => this.add(),\n      customLabel: this.state.custom.label,\n      customTotal: this.state.custom.total,\n      customClient: this.state.custom.client,\n      onCustomLabel: e => this.setState(s => ({ custom: { ...s.custom, label: e.target.value } })),\n      onCustomTotal: e => this.setState(s => ({ custom: { ...s.custom, total: e.target.value } })),\n      onCustomClient: e => this.setState(s => ({ custom: { ...s.custom, client: e.target.value } })),\n      totalFmt: money(total), discountFmt: money(discount), clientFmt: money(client),\n      discountPct: total > 0 ? Math.round(discount / total * 100) + '%' : '0%',\n      budget: this.state.budget,\n      onBudget: e => this.setState({ budget: e.target.value }),\n      budgetColor: over ? '#E36464' : '#A4CE39',\n      budgetBar: Math.min(100, budgetPct) + '%',\n      budgetNote: budget > 0\n        ? (over ? `${Math.round(budgetPct)}% of budget — over by ${money(client - budget)}` : `${Math.round(budgetPct)}% of budget used`)\n        : 'Set a budget to compare',\n      onPrint: () => window.print(),\n      onClear: () => this.setState({ rows: [] })\n    };\n  }\n}\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
